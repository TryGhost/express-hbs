strictDepBuilds: true
minimumReleaseAge: 4320
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  - '@tryghost/*'

# glob 13 and minimatch 10 have no patched release; these parents (mocha, nyc,
# test-exclude, js-beautify, editorconfig) only use APIs the patched majors keep.
overrides:
  'glob@13': 14.0.4
  'minimatch@10': 11.0.5
